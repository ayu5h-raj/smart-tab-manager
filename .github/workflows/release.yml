name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create ZIP archive
        run: |
          # Zip the dist folder content
          zip -r smart-tab-manager-${{ github.ref_name }}.zip dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: smart-tab-manager-${{ github.ref_name }}.zip

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Smart Tab Manager ${{ github.ref_name }}
          body: |
            ## Smart Tab Manager ${{ github.ref_name }}

            Manage your tabs efficiently with AI.

            ### Installation
            1. Download `smart-tab-manager-${{ github.ref_name }}.zip`
            2. Unzip the file
            3. Open Chrome and go to `chrome://extensions`
            4. Enable "Developer mode" (top right)
            5. Click "Load unpacked" and select the unzipped `dist` folder
          files: |
            smart-tab-manager-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
